<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1f3d" />
    <title>오프라인 | Rion Order</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #0f1f3d; color: #0f1f3d; font-family: system-ui, sans-serif; }
      .card { max-width: 420px; padding: 32px; border-radius: 20px; background: #fff; text-align: center; box-shadow: 0 16px 40px rgba(0, 0, 0, .2); }
      h1 { margin: 0; font-size: 25px; }
      p { margin: 12px 0 22px; color: #64748b; line-height: 1.65; }
      button { min-height: 46px; padding: 0 18px; border: 0; border-radius: 12px; background: #0f1f3d; color: #fff; font-weight: 750; cursor: pointer; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>인터넷 연결을 확인해 주세요</h1>
      <p>Rion Order는 최신 주문 정보를 확인하기 위해 인터넷 연결이 필요합니다.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
